[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[project]
name = "beecount-cloud"
version = "1.6.6"
license-files = ["LICENSE*"]
description = "蜜蜂记账自建云"
readme = "README.md"
authors = [
    { name = "TNT-Likely", email = "sunxiaoyes@outlook.com" }
]
keywords = ["bookkeeping", "personal-finance"]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.13.2",
    "apscheduler>=3.10.4",
    "cryptography>=42.0.0",
    "email-validator>=2.2.0",
    "fastapi>=0.111.0",
    "httpx>=0.27.0",
    "mcp>=1.27.0,<2",
    "mypy>=1.11.1",
    "numpy>=1.26.0",
    "openpyxl>=3.0",
    "passlib>=1.7.4",
    "psycopg[binary]>=3.2.1",
    "pydantic>=2.8.2",
    "pydantic-settings>=2.3.4",
    "pyjwt>=2.9.0",
    "pyotp>=2.9.0",
    "pytest>=8.3.2",
    "python-multipart>=0.0.9",
    "pyzipper>=0.3.6",
    "ruff>=0.5.5",
    "sqlalchemy>=2.0.30",
    "types-pyyaml>=6.0.12.20240311",
    "uvicorn[standard]>=0.30.0",
]

[project.urls]
"Homepage" = "https://count.beejz.com/"
"Source Code" = "https://github.com/TNT-Likely/BeeCount-Cloud"
"Bug Reports" = "https://github.com/TNT-Likely/BeeCount-Cloud/issues"
